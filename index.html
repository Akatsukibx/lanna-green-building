<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lannacom Green Building — Signage</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* จอ BrightSign 1920x1080 แนวนอน · เวทีคงที่ 1920x1080 แล้วย่อ/ขยายพอดีหน้าต่าง · ใช้ CSS/JS แบบเก่า (ไม่มี gap ใน flex, ไม่มี ?. ??) เผื่อ Chromium รุ่นเก่าบนเครื่องเล่น */
:root { --green:#4f6a1f; --green-d:#2c3f12; --leaf:#7aa63a; --cream:#f6f4ec; --ink:#1d2410; --mut:#5b6648; --warn:#d98e04; --bad:#c0392b; --ok:#3d9a3a; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; cursor:none; }
body { font-family:"Sarabun", "Noto Sans Thai", Tahoma, sans-serif; color:var(--ink); }
#stage { position:absolute; left:50%; top:50%; width:1920px; height:1080px; margin-left:-960px; margin-top:-540px; background:var(--cream); overflow:hidden; transform-origin:50% 50%; }
.scene { position:absolute; left:0; top:0; width:1920px; height:1080px; opacity:0; visibility:hidden; transition:opacity 1s ease, transform 1.1s cubic-bezier(.2,.8,.2,1), visibility 0s linear 1s; background:transparent; will-change:opacity,transform; backface-visibility:hidden; }
/* ท่าเข้าฉาก: สลับ 3 แบบ (เลื่อนจากขวา / ซูมเข้า / ลอยขึ้น) */
.scene.fx-slide { transform:translateX(70px); }
.scene.fx-zoom { transform:scale(1.04); }
.scene.fx-rise { transform:translateY(40px); }
.scene.on { opacity:1; visibility:visible; transform:none; transition:opacity 1s ease, transform 1.1s cubic-bezier(.2,.8,.2,1); }
.scene.out { opacity:0; visibility:visible; transform:translateX(-50px); transition:opacity .7s ease, transform .9s ease-in; }
.scene.out.fx-zoom { transform:scale(.97); }
.scene.out.fx-rise { transform:translateY(-30px); }
/* องค์ประกอบในฉากทยอยลอยขึ้น (ดีเลย์ตั้งใน JS) */
.rise { opacity:0; transform:translateY(24px); }
.go .rise { opacity:1; transform:none; transition:opacity .7s ease, transform .8s cubic-bezier(.2,.8,.2,1); }
/* ฉากต้อนรับ */
.bub { position:absolute; bottom:-320px; border-radius:50%; background:rgba(255,255,255,.07); }
.go .bub { animation-name:floatUp; animation-timing-function:linear; animation-fill-mode:forwards; }
@keyframes floatUp { from { transform:translateY(0); } to { transform:translateY(-1550px); } }
.wlogo { position:absolute; left:50%; margin-left:-230px; top:130px; width:460px; background:#fff; border-radius:24px; padding:16px 28px; opacity:0; transform:scale(.7); }
.go .wlogo { opacity:1; transform:none; transition:opacity .6s ease .2s, transform .9s cubic-bezier(.2,.9,.3,1.3) .2s; }
.wt1 { position:absolute; left:0; top:380px; width:100%; text-align:center; font-size:66px; font-weight:600; color:#cfe3a9; opacity:0; transform:translateY(30px); }
.go .wt1 { opacity:1; transform:none; transition:opacity .7s ease .8s, transform .7s ease .8s; }
.wt2 { position:absolute; left:0; top:455px; width:100%; text-align:center; font-size:220px; line-height:1.15; font-weight:800; color:#fff; }
.wl { display:inline-block; opacity:0; transform:translateY(90px) scale(.8); }
.go .wl { opacity:1; transform:none; transition:opacity .5s ease, transform .85s cubic-bezier(.2,.9,.3,1.35); }
.wline { position:absolute; left:50%; top:735px; width:0; height:8px; background:var(--leaf); border-radius:4px; transform:translateX(-50%); }
.go .wline { width:480px; transition:width .9s ease 2.1s; }
.wt3 { position:absolute; left:0; top:775px; width:100%; text-align:center; font-size:44px; color:#e6f0d2; opacity:0; }
.go .wt3 { opacity:1; transition:opacity .8s ease 2.4s; }
.wicons { position:absolute; left:0; top:870px; width:100%; text-align:center; }
.wi { display:inline-block; margin:0 24px; opacity:0; transform:scale(.3); }
.go .wi { opacity:1; transform:none; transition:opacity .4s ease, transform .6s cubic-bezier(.2,.9,.3,1.6); }
.scene.dark { background:linear-gradient(135deg,#1f2e0c 0%,#2f4a14 55%,#3d6118 100%); color:#fff; }
.hd { position:absolute; left:80px; top:54px; width:1250px; }
.hd h1 { font-size:64px; line-height:1.15; font-weight:800; color:var(--green-d); }
.dark .hd h1 { color:#fff; }
.hd .en { font-size:30px; margin-top:6px; color:var(--mut); font-weight:400; }
.dark .hd .en { color:#cfe3a9; }
.hdico { position:absolute; left:80px; top:50px; }
.hd.hi { left:208px; width:1180px; }
.hd.hi h1 { font-size:58px; }
.hd.hi .en { font-size:28px; }
.ico { display:inline-flex; align-items:center; justify-content:center; border-radius:50%; flex:none; box-shadow:0 4px 12px rgba(30,40,10,.2); }
.lh { display:flex; align-items:center; }
.ico.sq { border-radius:28px; box-shadow:none; border:2px solid rgba(79,106,31,.16); }
.ico.sq.dk { border-color:rgba(255,255,255,.22); }
#stage.hv-bar .hdico, #stage.hv-plain .hdico { display:none; }
#stage.hv-bar .hd.hi { left:116px; width:1180px; }
#stage.hv-bar .hd.hi:before { content:""; position:absolute; left:-36px; top:8px; width:10px; height:96px; border-radius:5px; background:var(--leaf); }
#stage.hv-plain .hd.hi { left:80px; width:1250px; }
.tico { display:inline-block; width:100px; height:100px; background:url(img/trees-icons.png) no-repeat; background-size:900px auto; background-origin:border-box; }
.hd:after { content:""; display:block; width:220px; height:8px; margin-top:18px; background:var(--leaf); border-radius:4px; }
.logo { position:absolute; right:70px; top:42px; width:410px; height:auto; background:#fff; padding:10px 18px; border-radius:16px; box-shadow:0 4px 14px rgba(30,40,10,.12); }
.dark .logo { box-shadow:none; }
.foot { position:absolute; left:0; bottom:0; height:10px; width:100%; background:rgba(79,106,31,.18); }
.foot i { display:block; height:100%; width:0; background:var(--leaf); }
.body { position:absolute; left:80px; right:80px; top:250px; bottom:60px; }
.p { font-size:38px; line-height:1.55; }
.p small { display:block; font-size:27px; line-height:1.45; color:var(--mut); margin-top:14px; }
.photo { position:absolute; overflow:hidden; border-radius:18px; background:#ddd; box-shadow:0 8px 28px rgba(30,40,10,.22); }
.photo img { width:100%; height:100%; object-fit:cover; display:block; transform:scale(1); }
.go .photo img { transition:transform 6s ease-out; transform:scale(1.07); }
.cap { position:absolute; left:80px; right:80px; font-size:34px; line-height:1.3; font-weight:600; color:var(--green-d); background:#e4ead3; border-left:12px solid var(--green); border-radius:10px; padding:10px 26px; }
.strip { position:absolute; left:80px; width:1760px; overflow:hidden; border-radius:16px; box-shadow:0 8px 28px rgba(30,40,10,.22); background:#ddd; }
.strip img { height:100%; width:auto; display:block; max-width:none; }
.card { background:#fff; border-radius:22px; box-shadow:0 6px 22px rgba(30,40,10,.14); padding:26px 30px; }
.dark .card { background:rgba(255,255,255,.10); box-shadow:none; border:2px solid rgba(255,255,255,.18); }
.chip { display:inline-block; font-size:28px; font-weight:800; color:#fff; background:var(--green); border-radius:12px; padding:2px 16px; margin-right:14px; }
.big { font-size:150px; line-height:1; font-weight:800; }
.big sub { font-size:44px; font-weight:600; margin-left:10px; vertical-align:baseline; }
.lbl { font-size:36px; font-weight:700; }
.lbl small { display:block; font-size:25px; font-weight:400; opacity:.75; margin-top:2px; }
.stat { position:absolute; text-align:left; }
.pill { display:inline-block; font-size:30px; font-weight:700; border-radius:40px; padding:4px 22px; color:#fff; margin-top:10px; }
.note { position:absolute; left:80px; right:80px; bottom:34px; font-size:25px; opacity:.8; }
.dbg { position:absolute; left:10px; top:10px; z-index:9; font:20px monospace; color:#0f0; background:rgba(0,0,0,.6); padding:4px 10px; display:none; }
</style>
</head>
